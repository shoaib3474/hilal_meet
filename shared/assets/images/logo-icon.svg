    <rect x="44" y="22" width="8" height="34" fill="#C8C0B0"/>
    <rect x="52" y="22" width="16" height="34" rx="5" fill="url(#handleGrad)"/>
    <rect x="52" y="26.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
    <rect x="52" y="31.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
    <rect x="52" y="44.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
    <rect x="52" y="49.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
    <line x1="16" y1="27.5" x2="43" y2="25.5" stroke="#C9A227" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>
    <path d="M17,29 L43,27 L43,43 L17,45 Z" fill="rgba(255,255,255,0.08)"/>
