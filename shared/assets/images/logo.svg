<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" role="img" aria-label="Pakeeza Hilal Meat">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C0808"/>
      <stop offset="100%" stop-color="#1A0404"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D8"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4C4A0"/>
      <stop offset="100%" stop-color="#B8A87A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B22A2A"/>
      <stop offset="100%" stop-color="#5C0F0F"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9B448"/>
      <stop offset="100%" stop-color="#AF8420"/>
    </linearGradient>
  </defs>

  <g transform="translate(3,3) scale(0.925)">
    <circle cx="40" cy="40" r="39.5" fill="url(#bgGrad)"/>
    <circle cx="40" cy="40" r="37.5" fill="none" stroke="#C9A227" stroke-width="1.6"/>
    <circle cx="40" cy="40" r="35.2" fill="none" stroke="#C9A227" stroke-width="0.5" opacity="0.45"/>

    <g transform="translate(40,40) rotate(-13) translate(-40,-40)">
      <path d="M14,26 L44,24 L44,22 L52,22 L52,56 L44,56 L44,54 L14,52 C9,50 9,28 14,26 Z" fill="url(#bladeGrad)"/>
      <rect x="44" y="22" width="8" height="34" fill="#C8C0B0"/>
      <rect x="52" y="22" width="16" height="34" rx="5" fill="url(#handleGrad)"/>
      <rect x="52" y="26.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
      <rect x="52" y="31.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
      <rect x="52" y="44.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
      <rect x="52" y="49.5" width="16" height="2" rx="1" fill="rgba(101,76,40,0.55)"/>
      <line x1="16" y1="27.5" x2="43" y2="25.5" stroke="#C9A227" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>
      <circle cx="37" cy="33" r="3.5" fill="#1A0404"/>
      <circle cx="37" cy="33" r="3.5" fill="none" stroke="rgba(201,162,39,0.4)" stroke-width="0.8"/>
      <line x1="15" y1="51" x2="43" y2="53" stroke="rgba(255,255,255,0.35)" stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <!-- Professional quality badge replacing decorative symbol -->
    <g opacity="0.95">
      <circle cx="55" cy="20" r="8.8" fill="none" stroke="#C9A227" stroke-width="1.4"/>
      <circle cx="55" cy="20" r="6.5" fill="none" stroke="#C9A227" stroke-width="0.8" opacity="0.65"/>
      <text x="55" y="22.1" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="4.1" font-weight="700" fill="#C9A227" letter-spacing="0.8">LDN</text>
    </g>

    <path d="M27,71 Q40,74 53,71" fill="none" stroke="#C9A227" stroke-width="0.7" opacity="0.4"/>
  </g>

  <line x1="84" y1="10" x2="84" y2="70" stroke="url(#accentGold)" stroke-width="1.5" opacity="0.8"/>

  <text x="92" y="36"
    font-family="'Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif"
    font-size="22" font-weight="700"
    fill="url(#brandGrad)"
    letter-spacing="1.5">PAKEEZA</text>

  <text x="92" y="56.2"
    font-family="'Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif"
    font-size="17" font-weight="700"
    fill="#5A1414"
    letter-spacing="0.9">HILAL MEAT</text>
