server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Home
    location = / {
        try_files /index.html =404;
    }

    # Shop with query params -> shop.html
    location /shop {
        try_files /shop.html =404;
    }

    # Product with query params -> product.html
    location /product {
        try_files /product.html =404;
    }

    # Cart with query params -> cart.html
    location /cart {
        try_files /cart.html =404;
    }

    # Checkout with query params -> checkout.html
    location /checkout {
        try_files /checkout.html =404;
    }

    # Account with query params -> account.html
    location /account {
        try_files /account.html =404;
    }

    # About and Contact (no query params needed)
    location = /about {
        try_files /about.html =404;
    }

    location = /contact {
        try_files /contact.html =404;
    }

    # Admin routes
    location = /admin {
        try_files /admin/index.html =404;
    }

    location /admin/ {
        # Try admin/ prefix paths
        try_files /admin/index.html /admin/dashboard.html /admin/orders.html /admin/products.html /admin/customers.html =404;
    }

    # Default - serve static files
    location / {
        try_files $uri $uri/ =404;
    }
}
