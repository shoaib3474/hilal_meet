<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Pakeeza Hilal Meat</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="/images/logo-icon.svg" alt="Pakeeza Hilal Meat" class="login-logo-icon">
            <h1>Pakeeza Hilal Meat</h1>
            <p>Admin Control Panel</p>
        </div>
        <div class="login-badge">
            <i class="fa-solid fa-lock" style="margin-right:6px;"></i>
            Secure Admin Access
        </div>
        <div class="error-msg" id="loginError"></div>
        <div class="form-group" style="margin-bottom:16px;">
            <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Email Address</label>
            <div class="input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="adminEmail" placeholder="admin@pakeezahilal.co.uk" value="admin@pakeezahilal.co.uk">
            </div>
        </div>
        <div class="form-group" style="margin-bottom:20px;">
            <label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Password</label>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="adminPassword" placeholder="••••••••" value="Admin@123" onkeydown="if(event.key==='Enter') doAdminLogin()">
            </div>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:13px;font-size:0.95rem;" onclick="doAdminLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In to Admin Panel
        </button>
        <div style="background:var(--primary-bg);border-radius:8px;padding:12px;margin-top:16px;font-size:0.8rem;color:var(--primary);">
            <strong>Demo Credentials:</strong><br>
            Email: admin@pakeezahilal.co.uk<br>
            Password: Admin@123
        </div>
        <div style="text-align:center;margin-top:16px;">
            <a href="/" style="font-size:0.82rem;color:var(--text-muted);">? Back to Website</a>
        </div>
    </div>
</div>

<script src="/js/data.js"></script>
<script type="module" src="/admin/js/admin.js"></script>
<script>
function doAdminLogin() {
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const errEl = document.getElementById('loginError');
    if (adminLogin(email, password)) {
        errEl.classList.remove('show');
        window.location.href = '/admin/dashboard.html';
    } else {
        errEl.textContent = 'Invalid email or password. Please check your credentials.';
        errEl.classList.add('show');
    }
}
</script>
</body>
</html>
